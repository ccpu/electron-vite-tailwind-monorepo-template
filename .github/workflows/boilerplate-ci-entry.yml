# CI for pull requests. Pushes to `main` are handled by release.yml, which builds
# them and additionally maintains the release PR.

name: React Electron Template CI
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - .editorconfig
      - '.vscode/**'

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default: this workflow builds whatever a pull request contains.
permissions:
  contents: read

jobs:
  run-ci:
    name: Build and test
    uses: ./.github/workflows/compile-and-test.yml
    with:
      distribution-channel: latest
    permissions:
      contents: read

  dependabot:
    permissions:
      contents: write
      pull-requests: write
    needs:
      - run-ci
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GH_TOKEN}}
