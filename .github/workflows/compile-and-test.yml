name: Compile and test

on:
  workflow_call:
    inputs:
      app-version:
        description: >-
          Version to stamp into package.json before packaging. Left empty, the
          version release-please already wrote into package.json is used as-is.
        required: false
        type: string
        default: ''
      distribution-channel:
        description: >-
          electron-updater channel. `latest` is the stable channel and the one
          electron-builder writes `latest.yml` for.
        required: false
        type: string
        default: latest
      attest:
        description: >-
          Sign build provenance for the installers. Only worth doing for builds
          that can actually ship, and it is what makes the caller hand over
          `id-token`/`attestations` write -- so pull request builds leave it off.
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: bash

# No `permissions` block on purpose. A reusable workflow may not request more
# than its caller granted -- GitHub rejects the run outright rather than
# trimming it -- so the scopes are left to each caller: pull request builds
# grant read only, and the release build additionally grants the `id-token` and
# `attestations` writes that `attest` needs.

env:
  NODE_NO_WARNINGS: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-project
        name: Setup project
      - run: pnpm run typecheck

  # Unit tests are platform-agnostic, so they run once here rather than once per
  # entry of the `compile` matrix.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-project
        name: Setup project
      - run: pnpm run test

  compile:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-project
        name: Setup project

      - name: Stamp the app version
        if: inputs.app-version != ''
        run: pnpm version "${{inputs.app-version}}" --no-git-tag-version

      # No GH_TOKEN here on purpose: `compile` runs `--publish never`, so it has
      # nothing to publish, and this job builds whatever code the caller points
      # it at.
      - run: pnpm run compile
        env:
          VITE_DISTRIBUTION_CHANNEL: ${{inputs.distribution-channel}}

      # `test:e2e:run` skips the rebuild -- the app was just compiled above.
      - run: pnpm run test:e2e:run
        if: matrix.os != 'ubuntu-latest'

      - run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- pnpm run test:e2e:run
        if: matrix.os == 'ubuntu-latest'

      - name: Collect release artifacts
        id: artifacts
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.deb dist/*.dmg dist/*.zip dist/*.AppImage dist/*.blockmap dist/latest*.yml dist/alpha*.yml dist/beta*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release artifacts were produced in dist/"
            ls -R dist || true
            exit 1
          fi
          for f in "${files[@]}"; do echo "found: $f"; done
          {
            echo 'paths<<ARTIFACTS_EOF'
            for f in "${files[@]}"; do echo "$f"; done
            echo 'ARTIFACTS_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v3
        if: inputs.attest
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}

      - name: Upload compiled app
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }}-${{inputs.distribution-channel}}
          path: dist
