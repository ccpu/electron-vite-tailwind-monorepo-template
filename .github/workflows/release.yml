# A push to main is the whole release: semantic-release reads the
# conventional-commit history, bumps package.json, writes the changelog, tags
# and creates the GitHub Release, then the installers are built and attached to
# it. There is deliberately no release pull request -- a bot-authored PR is what
# made GitHub hold every run for approval.
#
# semantic-release rather than changesets because the version that ships lives
# in the root package.json, which is what electron-builder reads; changesets
# versions workspace members and would never touch it.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Version and release
    runs-on: ubuntu-latest
    # The release commit is pushed back to main. GITHUB_TOKEN pushes do not
    # start another run, and the marker covers the case where a PAT is used.
    if: >-
      ${{
        github.event_name != 'push' ||
        !contains(github.event.head_commit.message, '[skip ci]')
      }}
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so the commits since the last tag can be read.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        name: Setup project

      # The `exec` plugin in .releaserc.json only runs when a release is
      # actually cut, so these outputs exist if and only if there was one.
      - name: Version, tag and release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec semantic-release

  build:
    name: Build and test
    needs:
      - release
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/compile-and-test.yml
    with:
      # Stamped rather than checked out, so the installers carry the version
      # that was just released without this job racing the bump commit.
      app-version: ${{ needs.release.outputs.version }}
      distribution-channel: latest
      attest: true

  publish:
    name: Attach installers to the release
    needs:
      - release
      - build
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag-name: ${{ needs.release.outputs.tag }}
      distribution-channel: latest
